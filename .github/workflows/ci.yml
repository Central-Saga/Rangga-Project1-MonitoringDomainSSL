name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, fix/**]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + static + test + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Kunci statis hanya untuk test di CI; bukan kunci produksi.
      APP_KEY: base64:KawdXVR0OVNw+X3o3WrVnwVDAsk241knRXBgEmuFOYg=
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, redis, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan/PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Static check (config + route cache)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan route:clear
          php artisan config:clear

      - name: Test
        run: php artisan test

      - name: Dependency audit (composer)
        run: composer audit --locked

  frontend:
    name: Frontend (lint + typecheck + audit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build

  release:
    name: Release (migrate + optimize + queue restart)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # Rehearsal rilis di runner: perintah deploy dijalankan sungguhan terhadap
    # Postgres/Redis sementara, bukan sekadar echo (audit #112 / backend 15.7).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: monitoring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: base64:KawdXVR0OVNw+X3o3WrVnwVDAsk241knRXBgEmuFOYg=
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: monitoring_db
      DB_USERNAME: monitoring
      DB_PASSWORD: secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SEED_PASSWORD: password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, redis, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # APP_KEY sudah disediakan lewat env job, jadi tidak perlu key:generate
      # (yang akan mengeluh karena .env.example memuat APP_KEY kosong).
      - name: Prepare environment
        run: cp .env.example .env

      # Migrasi benar-benar dijalankan sebagai job rilis (bukan lagi echo).
      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Optimize + queue restart + storage link
        run: |
          php artisan storage:link --force
          php artisan optimize
          php artisan queue:restart

      - name: Verify release artifacts
        run: |
          test -L public/storage
          php artisan audit:verify
